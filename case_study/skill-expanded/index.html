<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guoqing Temple · 國清寺 — A Thousand-Year Plan</title>
    <style>
      button.group.absolute.bottom-6.left-6 {
        left: 50%;
        right: auto;
        bottom: 24px;
        z-index: 45;
        min-width: 300px;
        min-height: 84px;
        justify-content: center;
        padding: 22px 36px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.06em;
        line-height: 1.25;
        transform: translateX(-50%);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
      }
      button.group.absolute.bottom-6.left-6 svg {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
      }
      #guided-walk-return {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 120;
        min-height: 52px;
        padding: 0 22px;
        border: 1px solid rgba(232, 179, 75, 0.72);
        border-radius: 999px;
        background: rgba(13, 10, 7, 0.92);
        color: #f2cf8a;
        font: 600 14px/1.2 Arial, sans-serif;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
      }
      #guided-walk-return:hover,
      #guided-walk-return:focus-visible {
        background: #e8b34b;
        color: #0d0a07;
        outline: none;
      }
      #guided-walk-return[hidden] { display: none; }
      @media (max-width: 640px) {
        button.group.absolute.bottom-6.left-6 {
          left: 50%;
          right: auto;
          bottom: 18px;
          min-width: min(320px, calc(100vw - 32px));
          min-height: 68px;
          padding: 17px 24px;
          font-size: 18px;
          transform: translateX(-50%);
        }
        #guided-walk-return { top: 12px; left: 12px; min-height: 46px; padding: 0 16px; }
      }
    </style>

toration",text:"The reformer Taixu (1890–1967) began restoring the war-worn temple from this gate northward, reopening the main axis for a new generation of monks and students."},{year:"Today",title:"The first view",text:"Visitors still enter the way pilgrims did: gate, courtyard, pond, terrace, hall — a sequence of reveals that the plan still performs."}],structure:[{label:"Gate towers",text:"Flanking watch towers frame the central passage; the roofline steps up toward the axis."},{label:"Stone threshold",text:"The path from the gate is the temple's spine — every building beyond is aligned to it."}],ties:[{node:"f-enjin",note:"Ennin's 838 diary records the great monasteries of Lin'an reached through gates like this"}],media:[{id:"gate-1",title:"The South Gate",image:"images/gate.jpg",caption:"Dusk at the threshold",body:"The gate is the plan's first instrument: two towers, a passage, and a view that is deliberately withheld until you pass through. Stone lions hold the threshold, and the lanterns mark the axis for evening processions. Every imperial name the temple received — Longyue, Guoqing, Guoqing, Guoqing — was announced to the world from this point northward."},{id:"gate-2",title:"The Approach",image:"images/wide.jpg",caption:"The complex from the valley",body:"Seen from the valley the temple reads as a cascade of dark roofs climbing the slope, the pagoda holding the north-east corner. The approach was always staged: a long path, a gate, a courtyard, then water — each threshold compressing the city and dilating the monastic time beyond it."},{id:"gate-3",title:"A Threshold of Records",image:"images/sutra.jpg",caption:"Diaries and sutras",body:"The gate is a hinge in the written record as much as in stone. In 838 the Japanese Tendai pilgrim Ennin passed through Lin'an's monasteries and set the city down in his diary; a thousand years later Taixu's students walked the same threshold to Fuhua University. Sutra, diary and lecture all begin at the gate."}]},yuchi:{id:"yuchi",zh:"玉泉魚躍",en:"Yu Terrace & Pond",teaser:"Ritual water before the great hall",era:"Classical axis · Song form",image:"images/yuchi.jpg",x:500,y:952,focus:{x:500,y:928,s:1.85},history:[{year:"Song",title:"The pond takes shape",text:"By the Song the courtyard had its classic form: a pond before a terrace, the terrace before the great hall. The water was kept for the temple's ritual fish-levitation (yu) ceremony, which gave the site its name."},{year:"Ming–Qing",title:"The yu ceremony",text:"On festival days the monks performed the yu rite on the terrace; the pond's fish leapt as the hall's drums sounded, and the hall's reflection doubled the axis in the water."},{year:"2006",title:"Axis restored",text:"The terrace and pond were restored together with the new Mahavira Hall, re-seating the ritual water at the foot of the 19.6-metre Medicine Buddha."}],structure:[{label:"Yu Terrace",text:"A raised stone terrace with carved balustrade — the stage of the temple's water ritual."},{label:"The pond",text:"Lotus and koi in still water; its surface mirrors the hall, doubling the axis in light."}],ties:[{node:"b-hall",note:"The pond is the forecourt of the Mahavira Hall"}],media:[{id:"yuchi-1",title:"The Yu Pond",image:"images/yuchi.jpg",caption:"Still water, doubled axis",body:"The pond is the plan's mirror: whatever rises on the terrace is answered in the water. Lotus leaves break the surface near the east bank, where the pavilion's willows screen the view. In the classical layout the pond is not scenery — it is the pause between the city and the Buddha."},{id:"yuchi-2",title:"Ritual Water",image:"images/sutra.jpg",caption:"The yu ceremony",body:"The yu rite bound water, sound and faith: drums from the hall, fish leaping from the pond, incense moving across the terrace. It is the kind of ceremony that survives longest in local memory — the site kept its name, Yu Chi, long after the original pond had been re-dug and re-walled."},{id:"yuchi-3",title:"The Shared Axis",image:"images/exchange.jpg",caption:"A grammar of courtyards",body:"Pond-before-hall is a shared grammar across East Asia: the same water-and-terrace logic appears in Japanese and Korean temple compounds, carried by monks, patrons and pattern books. Standing on the Yu Terrace, one stands inside a regional syntax, not merely a local site."}]},"main-hall":{id:"main-hall",zh:"大雄寶殿",en:"Mahavira Hall",teaser:"Rebuilt 2006 around a 19.6 m Buddha",era:"Rebuilt 2006",image:"images/main-hall.jpg",x:500,y:748,focus:{x:500,y:762,s:1.9},history:[{year:"552",title:"First great hall",text:"The original Longyue Temple had its own great hall on this axis; every rebuild since has kept the hall at the centre of the plan."},{year:"978",title:"Guoqing bestowed",text:"When Emperor Zhenzong of Song bestowed the name Guoqing — “national precepts” — the axis of pond, terrace and hall took its classic ceremonial form."},{year:"2006",title:"Rebuilt for the Medicine Buddha",text:"The new Mahavira Hall, 38.9 metres tall, enshrines a 19.6-metre wooden Medicine Buddha (Yaoshi Fo) — one of the largest wooden Buddha statues in East Asia."}],structure:[{label:"One sweeping roof",text:"A single broad roof over the hall's full width; the ridge line is the highest horizontal in the plan."},{label:"The Medicine Buddha",text:"A 19.6 m wooden statue, gilded and haloed, seated on the central dais — the hall is built around its scale."},{label:"Terrace axis",text:"The hall faces the Yu Terrace across the pond; ritual processions move along this north–south line."}],ties:[{node:"t-medicine",note:"The hall enshrines the Medicine Buddha devotion"},{node:"b-sui",note:"Hall and pagoda bookend the plan's two high points"}],media:[{id:"hall-1",title:"The Great Hall",image:"images/main-hall.jpg",caption:"The axis, re-seated in 2006",body:"The rebuilt hall keeps the old geometry — one roof, one dais, one axis — while its scale now answers the statue inside. The eaves sweep low over the terrace so that the pond's reflection carries the whole roofline. Vermilion columns and dark tile keep the hall inside the temple's ink-and-gold palette."},{id:"hall-2",title:"The Medicine Buddha",image:"images/main-hall-interior.jpg",caption:"19.6 metres of wood",body:"Inside, the hall is a single volume built around the Medicine Buddha: a 19.6-metre wooden statue with gilded halo, rising through beams of incense smoke to the dark timber roof. The Medicine Buddha (Yaoshi Fo) is the healing Buddha of the eastern pure land — a devotion shared across Chinese, Japanese and Korean Buddhism, and the reason the hall's interior is lit from below."},{id:"hall-3",title:"Shared Devotion",image:"images/exchange.jpg",caption:"One Buddha, three countries",body:"The Medicine Buddha travels: his sutras were translated in China, copied in Japan, and chanted in Korea; his iconography moved with monks in every direction. The Guoqing hall is one node in a network of healing-Buddha devotion that has bound the three countries for a millennium."}]},"dharma-hall":{id:"dharma-hall",zh:"法堂",en:"Dharma Hall",teaser:"Great Linji seat · Fuhua Univ. 1942",era:"Great Linji seat",image:"images/dharma-hall.jpg",x:500,y:548,focus:{x:500,y:562,s:1.8},history:[{year:"Tang",title:"Zen takes root",text:"By the Tang the temple was a great Zen centre; the dharma hall became the stage for lectures, chants and the transmission of the Linji line."},{year:"1157",title:"Master Chaoqun",text:"The Linji master Chaoqun (1091–1157) led the temple, and the Linji school flourished here as one of its great seats."},{year:"1942",title:"Fuhua University",text:"Taixu founded Fuhua University on the temple grounds, reviving monastic education; among its students was the future master Yinshun."}],structure:[{label:"The teaching hall",text:"A two-storey hall above the main axis; the upper floor hosts lectures and the dharma assembly."},{label:"Bell and drum",text:"The hall's bell and drum frame the monastic day — the same hours kept in Lin'an for a thousand years."}],ties:[{node:"t-linji",note:"Guoqing is a great seat of the Linji school"},{node:"i-fuhua",note:"Fuhua University was founded here in 1942"}],media:[{id:"dh-1",title:"The Dharma Hall",image:"images/dharma-hall.jpg",caption:"Where the teaching is kept",body:"The dharma hall sits at the north end of the main axis, where the ritual sequence ends and the intellectual one begins. Lanterns mark its two storeys; the upper floor is the lecture room, the lower the assembly. For a thousand years the bell and drum of this hall have set the hours of the temple."},{id:"dh-2",title:"The Linji Teaching",image:"images/sutra.jpg",caption:"A school that crossed the sea",body:"The Linji (Rinzai) school — famous for its koans and its abrupt, direct method — took one of its great seats at Guoqing. From Lin'an the teaching travelled: to Japan, where it became Rinzai Zen, and to Korea, where it entered the Seon line. The hall is the origin node of that transmission."},{id:"dh-3",title:"Carried Across the Sea",image:"images/exchange.jpg",caption:"Monks as carriers",body:"Transmission was never abstract: it moved in the bodies of monks — Ennin's diary in 838, Jinul's decade of study from 1183, Taixu's students in the 1940s. Each generation re-carried the same teaching, and the dharma hall is where the carrying began and ends."}]},pavilion:{id:"pavilion",zh:"雨花亭",en:"Yuhua Pavilion",teaser:"The scholar's pause by the pond",era:"Ming form",image:"images/pavilion.jpg",x:695,y:942,focus:{x:700,y:928,s:2.1},history:[{year:"Ming",title:"A place for literati",text:"The pavilion by the pond became the temple's meeting place with scholars and poets — a pause point between the ritual axis and the everyday world."},{year:"Qing",title:"Ink and lotus",text:"Qing poets wrote of the lotus pond from this pavilion; its small roof is a counterweight to the great hall's across the water."},{year:"Today",title:"A view of the spire",text:"From the pavilion the rebuilt Sui Pagoda rises to the north-east — the two landmarks framing each other across the grounds."}],structure:[{label:"Four-corner roof",text:"A compact four-eaved roof on slender columns — the lightest structure in the plan."},{label:"Pond edge",text:"Set on the pond's east bank; willows screen the water and the hall beyond."}],ties:[{node:"f-jinul",note:"Visiting monks and scholars of the Lin'an monasteries gathered at pavilions like this"}],media:[{id:"pv-1",title:"The Pavilion",image:"images/pavilion.jpg",caption:"The lightest roof in the plan",body:"The Yuhua Pavilion is the plan's counterweight: where the hall is mass, the pavilion is a hinge. Its four eaves lift over slender columns at the pond's edge, and the willows do the rest. It is the one place in the temple built for looking rather than for ritual."},{id:"pv-2",title:"Ink and Lotus",image:"images/sutra.jpg",caption:"The literati's temple",body:"Temples of Guoqing's standing were never monastic alone: scholars came for the ink, the lotus and the view, and left poems on the walls. The pavilion is where that double life — monk and literati — was staged, and where the temple's cultural reach extended beyond the monastic wall."},{id:"pv-3",title:"A View of the Spire",image:"images/wide.jpg",caption:"Two landmarks, one frame",body:"From the pavilion the rebuilt Sui Pagoda holds the north-east horizon. The pairing is deliberate in the plan: a low, open structure framing a tall, closed one — the temple's two time-scales, Ming leisure and Sui permanence, held in a single view."}]},"sui-pagoda":{id:"sui-pagoda",zh:"隋塔",en:"Sui Pagoda",teaser:"Sui 601 · burned 1933 · reborn 2001",era:"Sui 601 → Rebuilt 2001",image:"images/sui-pagoda.jpg",x:700,y:522,focus:{x:705,y:528,s:2.1},history:[{year:"601",title:"Raised for a new capital",text:"Emperor Wen of Sui ordered the pagoda to mark the founding of the new capital Daxing (Chang'an). The original rose 15 storeys to 46.7 m — an octagonal brick-and-tile spire among the earliest of its kind."},{year:"1933",title:"Fire",text:"A fire gutted the upper storeys; the brick shell stood as a ruin for decades, still marking the temple's north-east corner."},{year:"2001",title:"Rebuilt",text:"A faithful 13-storey, 61.5 m brick-and-tile reconstruction rose on the same footprint — now the tallest structure in the temple."}],structure:[{label:"Brick-and-tile core",text:"Load-bearing brick faced with tile, in the Sui tradition — no timber frame, unlike the halls."},{label:"Octagonal plan",text:"Eight sides and eight corners: the pagoda form that travelled from China to Japan and Korea."},{label:"13 storeys",text:"The rebuilt height of 61.5 m exceeds the original's 46.7 m."}],ties:[{node:"b-sui",note:"The octagonal brick pagoda is the shared grammar of East Asian pagodas"}],media:[{id:"sp-1",title:"The Rebuilt Spire",image:"images/sui-pagoda.jpg",caption:"13 storeys, 61.5 metres",body:"The rebuilt Sui Pagoda keeps the original's octagonal brick-and-tile grammar: load-bearing brick, tile eaves, small arched windows, no timber frame. At 61.5 metres it now out-tops its 46.7-metre ancestor, but from the pond it reads as the same silhouette that has held the temple's north-east corner for fourteen centuries."},{id:"sp-2",title:"A Spire Through Fire",image:"images/wide.jpg",caption:"1933 → 2001",body:"In 1933 fire took the upper storeys; for seventy years the brick shell stood as a ruin, a landmark of absence. The 2001 reconstruction was an act of memory as much as engineering — the same footprint, the same brick, a taller spire. The pagoda is the temple's argument that time can be repaired in place."},{id:"sp-3",title:"Shared Grammar",image:"images/exchange.jpg",caption:"The octagon travels",body:"The octagonal brick pagoda is the shared grammar of East Asian verticality: the same eight-sided logic appears in Japan's earliest wooden pagodas and in Korea's stone pagodas. The Sui Pagoda is not a Chinese curiosity — it is a node in a regional syntax of height, carried across the sea by monks and masons."}]}},Lf=[{id:"e552",year:"552",sortYear:552,dynasty:"Liang",theme:"Longyue founded",text:"Emperor Wu of Liang founds the temple on the site of a Liang imperial residence, naming it Longyue — “Dragon and Moon” — after a palace of the same name.",image:"images/wide.jpg",landmarkId:"gate"},{id:"e597",year:"597",sortYear:597,dynasty:"Sui",theme:"Guoqing",text:"Under the Sui the temple is renamed Guoqing — “national precepts” — as it grows into one of the great monasteries of the south.",image:"images/gate.jpg",landmarkId:"gate"},{id:"e601",year:"601",sortYear:601,dynasty:"Sui",theme:"Sui Pagoda",text:"Emperor Wen of Sui raises a 15-storey, 46.7 m octagonal brick pagoda to mark the founding of the new capital Daxing.",image:"images/sui-pagoda.jpg",landmarkId:"sui-pagoda"},{id:"e828",year:"828",sortYear:828,dynasty:"Tang",theme:"Guoqing",text:"A Tang edict names the temple Guoqing — “the national precept” — fixing the third of its imperial names.",image:"images/dharma-hall.jpg",landmarkId:"dharma-hall"},{id:"e838",year:"838",sortYear:838,dynasty:"Tang",theme:"Ennin's diary",text:"The Japanese Tendai monk Ennin stays in Lin'an on his way to Tiantai; his diary Zuowu Guoshi records the city's great monasteries.",image:"images/sutra.jpg",landmarkId:"gate"},{id:"e978",year:"978",sortYear:978,dynasty:"Song",theme:"Guoqing bestowed",text:"Emperor Zhenzong of Song bestows the name Guoqing — “national precepts” — and the axis of pond, terrace and hall takes its classic form.",image:"images/main-hall.jpg",landmarkId:"main-hall"},{id:"e1157",year:"1157",sortYear:1157,dynasty:"Song",theme:"Linji seat",text:"The Linji master Chaoqun (1091–1157) leads the temple; the Linji school flourishes here as one of its great seats.",image:"images/dharma-hall.jpg",landmarkId:"dharma-hall"},{id:"e1183",year:"1183",sortYear:1183,dynasty:"Song",theme:"Jinul studies",text:"The Korean patriarch Jinul (1158–1210) studies at the great monasteries of Lin'an for over a decade before   <body>
    <div id="root"></div>
    <button id="guided-walk-return" type="button" hidden>← Return to Master Map</button>
    <script>
      (() => {
        const proxy = document.querySelector("#guided-walk-return");
        const root = document.querySelector("#root");
        const sync = () => {
          const source = Array.from(root.querySelectorAll("button")).find(
            button => button.textContent.trim() === "Return to Master Map"
          );
          proxy.hidden = !source;
          proxy.onclick = source ? () => source.click() : null;
        };
        new MutationObserver(sync).observe(root, { childList: true, subtree: true });
        document.addEventListener("click", () => requestAnimationFrame(sync), true);
        sync();
      })();
    </script>
