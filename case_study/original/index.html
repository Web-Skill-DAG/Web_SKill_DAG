ra foundations)",foundedYear:652,eraIds:["sui","tang","song","yuan","ming","qing","modern"],x:380,y:320,summary:"The brick reliquary that anchored the temple for a millennium — built to keep safe the sutras and statues Xuanzang carried back from India.",story:["The pagoda's purpose was archival before it was monumental. In 648, the emperor granted Xuanzang a plot of ground to translate his Indian haul of 657 texts, and by 652 the first five-storey brick tower rose on it — a reliquary for the Buddha relics and 1,500 volumes of scripture he had risked his life to carry across the Taklamakan.","It has been rebuilt at least four times. The Tang original was timber; a fire in the late 8th century left a brick shell that the Song court rebuilt in 959. The form you see today — seven storeys, 64 metres, a tapering square of grey brick with corner finials — is the 1551 Ming reconstruction, which lowered the profile and thickened the walls after the tower had leaned dangerously.","The name itself is a pilgrimage story. The 'Wild Goose' (Yàn) legend says the monks watched wild geese fall dead from the sky rather than break a vow of non-killing, and the tower was named for that devotion. Inside, its chambers once held the only complete Chinese canon outside the state scriptoria — a second library of the East."],stats:[{label:"Storeys",value:"7"},{label:"Height",value:"64.5 m"},{label:"Base",value:"25 × 25 m"},{label:"First built",value:"652 CE"},{label:"Present form",value:"1551, Ming"},{label:"Texts carried",value:"657"}],figures:[{name:"Xuanzang",han:"玄奘",role:"Translator · 602–664",note:"17 years on the road; his 75-volume biography, the Da Tang Xiyu Ji, is a survey of 138 kingdoms."},{name:"Emperor Gaozong",han:"唐高宗",role:"Patron · r. 649–683",note:"Granted the land and a state fund; the pagoda was, in effect, a Tang imperial project."}],connections:["mahavira","daxuanyuan","nan-yue","yutian"],image:"images/sui-pagoda.jpg",imageCaption:"The seven-storey brick tower, Ming form, 1551 — seen from the south axis."},{id:"mahavira",name:"Mahavira Hall",han:"大雄宝殿",en:"Hall of the Great Hero",kind:"structure",founded:"648 CE · Tang (rebuilt 1999–2002)",foundedYear:648,eraIds:["sui","tang","song","yuan","ming","qing","modern"],x:380,y:555,summary:"The ceremonial heart of the temple: a double-eaved hall where the Buddha of the present age is enthroned and the axis of the complex turns from stone to ritual.",story:["Every Chinese Buddhist monastery is organized as a sequence of thresholds, and the Mahavira Hall is the one that matters. Before it, the axis is architectural — gates, courtyards, steles. After it, the axis is ritual: here the sangha gathers for the daily recitations, the Dharma assemblies, and the festivals that have run without interruption for thirteen centuries.","The Tang original was a timber hall of the highest imperial rank, its roof pitched in the double-eave form reserved for major state temples. Successive dynasties rebuilt it on the same footprint; the hall that stood until the 1990s was a Ming–Qing hybrid. The current structure, completed in 2002, follows the Tang pattern of the period's only surviving timber great hall — the Fogong Temple hall in Shanxi — so the roofline you see is a deliberate 1,350-year rewind.","Inside, the main altar carries a gilded seated Śākyamuni, the Buddha of this world-age, flanked by the two great disciples and the two guardian bodhisattvas. The rear wall holds the 'Three Bodies of the Buddha' — Dharma, Nirmana, Sambhoga — a doctrinal diagram in gilt: the teaching, the historical man, and the celestial body, one doctrine in three registers."],stats:[{label:"Roof form",value:"Double-eave hip"},{label:"Main image",value:"Gilt Śākyamuni"},{label:"Altar group",value:"5 figures"},{label:"First built",value:"648 CE"},{label:"Current build",value:"2002"},{label:"Model",value:"Fogong, 1056"}],figures:[{name:"Śākyamuni",han:"释迦牟尼",role:"The Buddha of this age",note:"Historic founder of Buddhism; the 'Great Hero' (Daxiong) of the hall's name is his honorific."},{name:"Ananda & Kaśyapa",han:"阿难 · 迦叶",role:"The two disciples",note:"Flanking the altar: the keeper of the oral canon and the keeper of the robe-line."}],connections:["sui-pagoda","ci-bo","daxuanyuan","nara","kyoto"],image:"images/mahavira-hall.jpg",imageCaption:"Double-eave timber hall on the central axis — the ritual heart of the complex."},{id:"ci-bo",name:"Hall of Compassion",han:"大慈恩寺·大悲殿",en:"Hall of the Great Compassion",kind:"structure",founded:"Tang · Guanyin cult, 8th c.",foundedYear:750,eraIds:["tang","song","yuan","ming","qing","modern"],x:222,y:555,summary:"Home of the Guanyin of the Southern Ocean — the bodhisattva whose cult travelled from Nalanda to Nara to Kyoto, carrying a single iconography across three courts.",story:["The Guanyin (Avalokiteśvara) cult is the single best proof that Chinese, Japanese and Korean Buddhism were one system with three accents. The bodhisattva of compassion was already famous in Tang Chang'an; at Ci'en Temple his hall became the destination for the annual Guanyin festival on the 19th day of the 2nd lunar month, when the city's monasteries processed with willow branches and sprinkled water.","The iconography that left Chang'an is the one that took root in Japan: the eleven-headed Guanyin, the White-Robed Guanyin, the water-pouring Guanyin. Japanese temples call him Kannon, and the Kannon-zō statues of Nara and Kyoto are stylistic children of Tang models — the same drapery fold, the same serene downward gaze.","Korea's role was the relay. Silla and Goryeo monasteries received Guanyin images through the same Sino-Korean sea routes that carried monks in both directions, and the Goryeo celadon Kannon of the 12th century is a Korean re-voicing of a Tang original — softer lines, colder glaze, the same vow."],stats:[{label:"Principal image",value:"Eleven-headed Guanyin"},{label:"Festival",value:"19th of 2nd lunar month"},{label:"Japanese name",value:"Kannon"},{label:"Cult peak",value:"Tang–Song"},{label:"Sea route",value:"Chang'an → Baekje"}],figures:[{name:"Avalokiteśvara",han:"观世音",role:"Bodhisattva of Compassion",note:"Hears the cries of the world; the most worshipped figure in East Asian Buddhism after the Buddha himself."},{name:"Jianzhen (Rigen)",han:"鉴真",role:"Monk · 688–763",note:"Blind after six crossings, he still reached Nara in 754 and carried Tang Guanyin practice with him."}],connections:["mahavira","nara","kyoto","bulguksa"],image:"images/compassion-hall.jpg",imageCaption:"The Guanyin hall — the iconography that crossed to Nara and Kyoto."},{id:"daxuanyuan",name:"Daxuanyuan",han:"大玄院",en:"The Grand Mystery Court",kind:"structure",founded:"645 CE · Tang",foundedYear:645,eraIds:["tang","song","yuan","ming","qing","modern"],x:528,y:555,summary:"Xuanzang's translation bureau — the largest scriptorium in the Tang empire, where 54 works and 1,335 volumes were rendered from Sanskrit in a single decade.",story:["When Xuanzang returned to Chang'an in 645, he did not retire to a cell. The state gave him a wing of Ci'en Temple and a staff: the poet-monk Yijing as editor, the scholar-monk Kuangzhe on style, a corps of scribes, painters and woodblock carvers. The Daxuanyuan was less a hall than a factory of meaning — the largest translation bureau the Chinese Buddhist world had seen.","Between 645 and 664 he produced 75 works in 1,335 volumes, including the Heart Sutra (the 260-character text that would become the most copied sutra in East Asia) and the Yogācāra masterpieces that defined the Faxiang school. His method was revolutionary: he refused to patch over Sanskrit grammar with loose Chinese paraphrase, coining thousands of technical terms — many of which are still the standard vocabulary of Buddhist philosophy in Chinese, Japanese and Korean.","The bureau's output travelled. Japanese and Korean monks copied the Daxuanyuan editions for centuries; the Heart Sutra he translated is the one chanted in a Kyoto temple today, word for word, thirteen centuries on. A translation bureau in a Tang monastery became the standard library of three civilizations."],stats:[{label:"Works translated",value:"75"},{label:"Volumes",value:"1,335"},{label:"Active",value:"645–664"},{label:"School founded",value:"Faxiang / 法相"},{label:"Masterpiece",value:"Heart Sutra"}],figures:[{name:"Xuanzang",han:"玄奘",role:"Chief translator",note:"Translated up to 10 volumes a month at peak; died mid-session in 664."},{name:"Yijing (Yijing)",han:"义净",role:"Editor · 635–713",note:"Later made his own Indian journey; his sea-route diary complements Xuanzang's overland survey."}],connections:["sui-pagoda","mahavira","kyoto","bulguksa"],image:"images/translation-court.jpg",imageCaption:"The translation court — scriptorium, studio and school in one wing."},{id:"ci-bo-gate",name:"Ci-bo Gate",han:"大慈恩寺山门",en:"The Mountain Gate",kind:"structure",founded:"648 CE · Tang",foundedYear:648,eraIds:["sui","tang","song","yuan","ming","qing","modern"],x:380,y:700,summary:"The threshold of the complex — where the city's stone axis ends and the monastic one begins, and where the temple's name was first written in stone.",story:["The mountain gate is the hinge of the whole design. Outside it, the street belongs to the city and its commerce; inside, the rules change — the pace slows, the floor rises, the sound of the bell replaces the sound of the market. This single threshold performs the conversion from the secular to the sacred that every Chinese monastery encodes.","The name of the temple is carved above it: 大慈恩寺, Ci'en — 'Temple of Great Loving-Kindness'. It was given in 648 by the crown princess, the future Empress Wu, in memory of her mother, the Empress of the Zhengde Palace. The word ci (great compassion) is the same character that names the Guanyin hall within — the temple's name is a promise about its contents.","Over the centuries the gate has been the stage for state ritual: imperial edicts were posted here, and on New Year's Eve the temple's bell was struck 108 times in the gate courtyard, the stroke that — in the old custom — closed the year for the whole of Chang'an. The gate was where the city and the temple shook hands."],stats:[{label:"Name meaning",value:"Great Loving-Kindness"},{label:"Named by",value:"Crown Princess, 648"},{label:"New Year's bell",value:"108 strikes"},{label:"Function",value:"Secular → sacred hinge"}],figures:[{name:"Empress Wu Zetian",han:"武则天",role:"Crown Princess at naming",note:"Named the temple for her mother; two decades later she became China's only female emperor."}],connections:["mahavira","sui-pagoda","yutian"],image:"images/gate.jpg",imageCaption:"The mountain gate — the hinge between Chang'an's street and the monastic axis."},{id:"ci-bo-pavilion",name:"Ci-bo Pavilion",han:"慈氏阁",en:"The Maitreya Pavilion",kind:"structure",founded:"Tang · 8th c.",foundedYear:780,eraIds:["tang","song","yuan","ming","qing","modern"],x:528,y:320,summary:"A small pavilion with a large eschatology: the seat of Maitreya, the Buddha-to-come, whose cave at Mount Wutai made this temple a node in a pan-Asian pilgrimage network.",story:["Maitreya — the Buddha who will come when the dharma fades — is the only figure in the East Asian canon with a present address. Chinese tradition places his hidden cave at Mount Wutai in Shanxi, and the great Maitreya halls of Wutai are the destination of pilgrims from Korea and Japan as much as China.","The pavilion at Ci'en kept the Maitreya cult local: a seated image of the future Buddha, flanked by the two disciples who, according to the Maitreya sutras, will be his first to hear the next teaching. The sutras themselves — the Gaṇḍavyūha and the Maitreyavyākaraṇa — were among the texts Xuanzang's bureau translated, so the temple's eschatology was, literally, of its own making.","The Maitreya cult is another thread of the Sino-Japanese-Korean weave: Japanese esoteric Buddhism enshrines Maitreya at Tōdai-ji's back hall, and Korean Wutai pilgrimages ran for centuries along the same sea routes as the monk traffic."],stats:[{label:"Principal image",value:"Seated Maitreya"},{label:"Cult centre",value:"Mt. Wutai"},{label:"Key sutras",value:"Gaṇḍavyūha"},{label:"Pilgrimage",value:"CN · KR · JP"}],figures:[{name:"Maitreya",han:"弥勒",role:"The Buddha-to-come",note:"Now a bodhisattva in the Tuśita heaven; will descend and teach when the present dharma ends."}],connections:["daxuanyuan","mahavira","bulguksa"]},{id:"ci-bo-stele",name:"Steles of the Canon",han:"藏经碑林",en:"The Stele Forest",kind:"monument",founded:"Tang–Ming · inscriptions",foundedYear:700,eraIds:["tang","song","yuan","ming","qing","modern"],x:222,y:320,summary:"A wall of carved stone carrying the canon, the commentary and the imperial edicts — the temple's memory written in a medium that outlives every roof above it.",story:["Stone was the insurance policy. Wood rots, paper burns, but a sutra cut into granite at three centimetres per character will outlast the dynasty that cut it. The stele forest of Ci'en gathers inscriptions from six centuries: Tang-era copies of the Heart Sutra, Song commentaries, Ming reconstruction edicts, and the 1792 Qing stele recording the temple's re-endowment.","The most studied stone is the Tang copy of the Heart Sutra — the same 260 characters Xuanzang's bureau fixed in 649. Comparing the carved version with the manuscript copies found in the Dunhuang caves shows how fast the text standardised: within a generation, the Daxuanyuan wording had won out across the empire, and with it across the sea.","Reading the forest is reading the temple's history in reverse — the newest stone at the front, the oldest at the back, so that a visitor walks backward through a millennium as they approach the pagoda."],stats:[{label:"Stones",value:"40+"},{label:"Span",value:"7th–18th c."},{label:"Key text",value:"Heart Sutra, carved"},{label:"Medium",value:"Granite"}],figures:[{name:"The canon carvers",han:"碑工",role:"Anonymous guilds",note:"Stele-cutting was a licensed craft; the best guilds were attached to the imperial workshops."}],connections:["daxuanyuan","sui-pagoda","yutian"]},{id:"ci-bo-ground",name:"The Central Axis",han:"中轴线",en:"Axis & Ground Plan",kind:"ground",founded:"648 CE · Tang layout",foundedYear:648,eraIds:["sui","tang","song","yuan","ming","qing","modern"],x:380,y:800,summary:"The invisible structure: a 200-metre north–south line on which every gate, hall and tower is pinned — the same logic that organizes the Forbidden City two kilometres away.",story:["Ci'en Temple was laid out on the same grid as the Tang capital itself — Chang'an was the largest planned city of its age, a 84 km² chessboard of 108 wards. The temple sits in the Xianyang Ward, and its central axis runs true north–south, parallel to the city's own axis that terminates at the Imperial City.","The sequence is a graded ascent: gate, courtyard, stele, courtyard, Mahavira Hall, courtyard, pagoda. Each threshold raises the floor and narrows the sky, so that by the time you stand under the pagoda you have physically climbed from the city into the canonical. The same graded-threshold logic, refined over two centuries, became the template for the Forbidden City — the temple is the ancestor of the palace plan.","Flanking the axis, the Tang layout kept the translation court to the east (the direction of scholarship and the rising sun) and the meditation cells to the west — a functional diagram of the monastic day: study in the morning, silence in the evening."],stats:[{label:"Axis length",value:"≈ 200 m"},{label:"Orientation",value:"True N–S"},{label:"Ward",value:"Xianyang, Chang'an"},{label:"City grid",value:"108 wards"},{label:"Legacy",value:"Palace-plan template"}],figures:[{name:"The Tang planners",han:"营缮署",role:"Imperial works office",note:"Chang'an's grid was designed under the Sui; the temple inherited its geometry directly."}],connections:["ci-bo-gate","mahavira","sui-pagoda","yutian"]}],Tf=[{id:"yutian",name:"Chang'an · Ci'en",han:"长安",en:"Tang capital · the source",country:"China",x:150,y:330,founded:"582 CE · Sui grid",role:"The source node",summary:"Tang capital, 1,000,000 inhabitants — the gravitational centre from which the canon, the iconography and the monastic architecture radiated.",story:["Chang'an under the Tang was the largest city on earth: a million people, a grid of 108 walled wards, and a policy of deliberate cosmopolitanism — Persian merchants, Turkic soldiers, Japanese and Korean students all resident under licence. Ci'en Temple was its flagship monastery, and the Daxuanyuan inside it was the empire's translation engine.","Everything in this map radiates from this point. The sutras were translated here; the pagoda form was built here; the Guanyin iconography was fixed here. The question the map answers is not 'what left Chang'an' but 'how completely it was received'."],stats:[{label:"Population",value:"≈ 1,000,000"},{label:"Wards",value:"108"},{label:"Role",value:"Source node"},{label:"Peak",value:"7th–8th c."}],figures:[{name:"Chang'an",han:"长安",role:"Capital, 582–904",note:"The 'Eternal Peace'; model for Kyoto's grid a century later."}],connections:["nan-yue","bulguksa","nara","kyoto"]},{id:"nan-yue",name:"Nanyue Port",han:"南海",en:"The southern sea lane",country:"China",x:235,y:420,founded:"Tang · 7th c.",role:"The maritime relay",summary:"The southern sea port where the overland canon met the maritime road — the launch point for the monk crossings to Baekje, Silla and Japan.",story:["The Silk Road is usually drawn as a line through the desert, but for Buddhism the sea was the faster wire. From the ports of the Pearl River delta and the Yangtze mouth, ships carried monks, statues and printed sutras to the Korean coast in weeks rather than the years an overland journey took.","Yijing, Xuanzang's great contemporary, made his Indian journey by sea from this coast in 671 — and his diary, the Record of Buddhist Practices Seen in the Southern Seas, is the primary source for the maritime Buddhist network. The same lanes that carried him outward carried the Daxuanyuan canon eastward."],stats:[{label:"Route",value:"Delta → Baekje coast"},{label:"Cargo",value:"Monks · statues · sutras"},{label:"Key diary",value:"Yijing, 691"},{label:"Speed",value:"Weeks, not years"}],figures:[{name:"Yijing",han:"义净",role:"Maritime pilgrim · 671",note:"His sea diary is the Rosetta stone of the maritime Buddhist network."}],connections:["yutian","bulguksa","nara"]},{id:"bulguksa",name:"Bulguksa · Silla",han:"佛国寺",en:"Temple of the Buddha-Kingdom",country:"Korea",x:480,y:300,founded:"751 CE · Unified Silla",role:"The Korean relay",summary:"The jewel of Silla Buddhism (751 CE) — a stone-and-timber temple that received the Tang canon and re-voiced it in celadon and granite.",story:["Korea was not a terminus but a relay with its own voice. Silla's state Buddhism, centred on temples like Bulguksa, was built on Tang models — the same axial plan, the same Guanyin cult — but executed with a stone masonry and a celadon glaze that are unmistakably Korean.","Bulguksa's Dabo Hall (751) enshrines a Silla Śākyamuni of the same iconographic family as the Tang altar images; its two stone pavilions frame the approach in a way that anticipates the gate-courtyard logic of the Chinese plan. Goryeo-era celadon Kannon statues are the physical proof: Tang models, Korean hands.","Korean monks also worked the return route: the Goryeo court sent scholars to the Song and Yuan capitals to copy canon editions, and Korean-printed sutras — including the 1377 Tripitaka Koreana, the most complete wooden-block canon in existence — became the reference edition for centuries."],stats:[{label:"Dabo Hall",value:"751 CE"},{label:"Dynasty",value:"Unified Silla"},{label:"Masterwork",value:"Tripitaka Koreana, 1377"},{label:"Role",value:"Relay + re-voicing"}],figures:[{name:"Jajang",han:"慈藏",role:"Monk · 605–676",note:"Silla's 'National Preceptor'; his temple became Bulguksa — 'Temple of the Buddha-Kingdom'."}],connections:["yutian","nan-yue","nara","kyoto"]},{id:"nara",name:"Nara · Tōdai-ji",han:"奈良",en:"Japan's first capital",country:"Japan",x:600,y:250,founded:"710 CE · capital",role:"The first Japanese seat",summary:"Japan's first capital and its great Buddha temple — where Jianzhen landed in 754 and the Tang monastic order was formally transplanted.",story:["Japan's adoption of Buddhism was a state project, and Nara was its first capital — its grid was drawn on Chang'an's. Tōdai-ji, built from 743, was the state's flagship: a timber great hall of such scale that its bronze Buddha (752) required a national foundry and a census of copper.","The decisive moment was 754: the Tang monk Jianzhen, blind and on his sixth attempt, reached Nara and was received with state ceremony. He brought what no statue could carry — the Vinaya, the monastic ordination platform, and the Tang practice of the Guanyin cult. Every Japanese ordination since 754 descends from the platform he established. The line is unbroken; it is a genealogy, not a metaphor."],stats:[{label:"Great Buddha",value:"15 m bronze, 752"},{label:"Jianzhen arrives",value:"754"},{label:"Ordination line",value:"Unbroken since"},{label:"Capital",value:"710–784"}],figures:[{name:"Jianzhen",han:"鉴真",role:"Vinaya master · 688–763",note:"Six crossings, two lost eyes, one unbroken ordination line."}],connections:["yutian","bulguksa","kyoto","nan-yue"],image:"images/transmission.jpg",imageCaption:"The maritime lane — Chang'an's canon arriving at Nara's state temple."},{id:"kyoto",name:"Kyoto · Heian-kyō",han:"京都",en:"Heian-kyō · the refined heir",country:"Japan",x:585,y:165,founded:"794 CE · capital",role:"The refined heir",summary:"Japan's second capital, planned on Chang'an's grid — where the Tang canon was refined into the Heian aesthetic and the esoteric schools.",story:["When Japan moved its capital to Heian-kyō (Kyoto) in 794, it copied Chang'an's grid almost street for street — and with the city came the canon. The Heian court's culture is, in a real sense, a Tang culture at one remove: the poetry, the dress, the temple architecture, and the sutras all arrived as Tang imports and were then refined into something distinctively Japanese.","The esoteric schools — Tendai and Shingon — formalised the transmission. Their ritual language is Sanskrit, their practice is Tang, and their temples (the Kōyō and Daidara complexes) carry the Ci'en axial logic in miniature. The Heart Sutra chanted in a Kyoto temple today is Xuanzang's 649 wording, unchanged."],stats:[{label:"Founded",value:"794"},{label:"Grid model",value:"Chang'an"},{label:"Schools",value:"Tendai · Shingon"},{label:"Key text",value:"Heart Sutra (649)"}],figures:[{name:"Kūkai",han:"空海",role:"Monk · 774–835",note:"Returned from Tang Chang'an in 806 and founded Shingon esotericism on what he had studied there."}],connections:["nara","yutian","bulguksa"]}],y0=[{id:"e581",year:"581",sortYear:581,label:"Sui founds Chang'an",detail:"The grid of 108 wards is laid out — the geometry the temple will inherit.",target:"ci-bo-ground",eraId:"sui"},{id:"e629",year:"629",sortYear:629,label:"Xuanzang departs",detail:"An unlicensed monk leaves for India with 657 texts' worth of questions.",target:"daxuanyuan",eraId:"tang"},{id:"e648",year:"648",sortYear:648,label:"Ci'en Temple founded",detail:"The crown princess names the temple 'Great Loving-Kindness'; the axis is set.",target:"ci-bo-gate",eraId:"tang"},{id:"e649",year:"649",sortYear:649,label:"Heart Sutra fixed",detail:"The Daxuanyuan's 260-character translation becomes the East Asian standard.",target:"daxuanyuan",eraId:"tang",lane:1},{id:"e652",year:"652",sortYear:652,label:"Pagoda raised",detail:"The five-storey brick reliquary goes up to house the Indian canon.",target:"sui-pagoda",eraId:"tang",lane:1},{id:"e754",year:"754",sortYear:754,label:"Jianzhen reaches Nara",detail:"Blind, on his sixth crossing — the Tang ordination line is transplanted to Japan.",target:"nara",eraId:"tang"},{id:"e794",year:"794",sortYear:794,label:"Kyoto founded",detail:"Heian-kyō is drawn on Chang'an's grid; the canon moves north with the court.",target:"kyoto",eraId:"tang"},{id:"e959",year:"959",sortYear:959,label:"Song rebuilds the pagoda",detail:"After the Tang timber burns, the brick core is rebuilt and re-clad.",target:"sui-pagoda",eraId:"song"},{id:"e1150",year:"c. 1150",sortYear:1150,label:"Goryeo celadon Kannon",detail:"Korea re-voices the Tang Guanyin in celadon — the relay speaks in its own hand.",target:"bulguksa",eraId:"song"},{id:"e1377",year:"1377",sortYear:1377,label:"Tripitaka Koreana",detail:"Korea carves 81,258 woodblocks — the most complete printed canon in existence.",target:"bulguksa",eraId:"yuan"},{id:"e1551",year:"1551",sortYear:1551,label:"Ming pagoda form",detail:"The leaning tower is rebuilt: seven storeys, 64 m — the silhouette that survives.",target:"sui-pagoda",eraId:"ming"},{id:"e1792",year:"1792",sortYear:1792,label:"Qing re-endowment",detail:"A stele is raised recording the temple's restoration and imperial patronage.",target:"ci-bo-stele",eraId:"qing"},{id:"e2002",year:"2002",sortYear:2002,label:"Mahavira Hall rebuilt",detail:"The great hall is reconstructed on the Tang pattern of the Fogong master hall.",target:"mahavira",eraId:"modern"}],g0=[{id:"ch1",index:"01",title:"The Axis",han:"轴",lede:"A temple is an argument in stone: that the sacred can be approached, step by step, from the ordinary.",body:["Ci'en Temple is organised on a single north–south line about two hundred metres long. Every element — gate, stele, hall, tower — is pinned to it, and the approach is a graded ascent: the floor rises, the sky narrows, the city's noise falls away threshold by threshold. By the time a visitor stands beneath the pagoda, the conversion from street to scripture has been performed by architecture rather than by sermon.","The axis is not an invention of the temple. It is the axis of Chang'an itself, the largest planned city of its age, and the same logic — refined across two centuries of Tang monastic building — became the template for the Forbidden City. The temple is, in a structural sense, the ancestor of the palace: the graded threshold, the flanking wings, the terminal tower."],facts:[{label:"Axis",value:"≈ 200 m, true N–S"},{label:"Thresholds",value:"7 graded"},{label:"Grid",value:"Chang'an, 108 wards"},{label:"Legacy",value:"Palace-plan template"}]},{id:"ch2",index:"02",title:"The Reliquary",han:"塔",lede:"The pagoda is a library before it is a monument — a brick vault for 657 texts and the relics that came with them.",body:["The Great Wild Goose Pagoda was built for a specific archive: the 657 sutras, vinaya texts and statues that Xuanzang carried back from India in 645. For a millennium the tower was the temple's second library — the state kept the official canon in its scriptoria, and the temple kept the imported original in brick.","The building's biography is a biography of repair. Timber burned, brick was rebuilt, the tower leaned, and in 1551 the Ming court rebuilt it into the seven-storey form that stands today. Each repair was also an act of statement: to rebuild the pagoda was to re-assert that the canon was still here, still whole, still the property of the living tradition."],facts:[{label:"Archive",value:"657 texts"},{label:"Rebuilds",value:"≥ 4"},{label:"Height",value:"64.5 m"},{label:"Present form",value:"1551"}]},{id:"ch3",index:"03",title:"The Transmission",han:"传",lede:"One canon, three accents: the sutras, the icons and the ordination lines that crossed from Chang'an to Nara and Kyoto.",body:["The map on the left is the argument. From Chang'an, the transmission ran two ways: overland influence through the Korean peninsula, and a faster maritime lane from the southern ports to Baekje and Silla. Korea received, re-voiced and returned — the Goryeo celadon Kannon and the 1377 Tripitaka Koreana are the relay speaking in its own hand. Japan received twice: the state project at Nara (the Great Buddha of 752, Jianzhen's ordination platform of 754) and the court refinement at Kyoto (the esoteric schools, the Heian aesthetic).","What crossed was not a text but a system: the canon, the iconography, the monastic rules, the architectural plan. The Heart Sutra chanted in Kyoto is Xuanzang's 649 wording; the ordination line of Japanese Buddhism descends, unbroken, from the platform Jianzhen established in Nara. Continuity here is genealogical, not metaphorical."],facts:[{label:"Lanes",value:"Overland + maritime"},{label:"Relay",value:"Silla / Goryeo"},{label:"Key date",value:"754, Nara"},{label:"Proof text",value:"Heart Sutra, 649"}]},{id:"ch4",index:"04",title:"The Repair",han:"修",lede:"A thousand years is not a lifespan but a maintenance schedule: burn, lean, rebuild, re-consecrate.",body:["The temple's history is a history of its repairs. The Tang timber hall burned; the Song rebuilt the pagoda's brick core; the tower leaned until the Ming rebuilt it in 1551; the Qing court re-endowed it in 1792 and cut the record into stone; in 2002 the Mahavira Hall was reconstructed on the Tang pattern of the Fogong master hall — a deliberate 1,350-year rewind, using the only surviving Tang great hall as its model.","Each repair carried a doctrine: that continuity is not the survival of matter but the survival of pattern. The brick is not the same brick; the axis is the same axis. This is the millennial logic of the site — and the reason a 14th-century Korean woodblock and a 7th-century Tang stele can stand in the same forest and be called one archive."],facts:[{label:"Fires",value:"≥ 2 major"},{label:"Rebuilds",value:"6 recorded"},{label:"Latest",value:"2002, Mahavira"},{label:"Doctrine",value:"Pattern over matter"}]}],v0=[...Sf,...Tf];function gf(v){return v0.find(N=>N.id===v)}function b0(v){return zn.find(N=>v>=N.from&&v<=N.to)??zn[zn.length-1]}const p0={structure:"Structure",relic:"Relic",monument:"Monument",ground:"Ground"},vf={China:"#c9a25c",Korea:"#7fa
