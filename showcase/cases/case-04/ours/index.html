support:"同じ間隔でも角度を変えると、面が動く速さが変わって見える。",kind:"stripe",palette:{bg:"#0f1220",a:"#ffb100",b:"#ff3d9a"},plates:["#ffb100","#ff3d9a","#4fc3ff",jr],h:318,tags:["斜線","運動","夜"],figure:"stack",meta:[{label:"角度",value:"48°"},{label:"反復",value:"30px"},{label:"地",value:"濃"}],body:["斜線は角度が視線の速度を決める。垂直に近いほど面は止まり、水平に近いほど流れる。四十八度はその中間で、静止と流動のどちらにも倒れない不安定な均衡を作る。","二色を交互に置くと、細い線が前に、太い線が奥に落ちる。順序を入れ替えるだけで奥行きが反転する。"]},{id:"p03",title:"点描の密度",caption:"二層の網点",support:"大小の点を半目ずらして重ね、灰色を作らずに中間調を出す。",kind:"dots",palette:{bg:"#fdfaf2",a:"#17150f",b:"#ff4b26"},plates:["#17150f","#ff4b26","#ffb100","#2743e8"],h:226,tags:["網点","中間調"],figure:"rings",meta:[{label:"網",value:"26px"},{label:"層",value:"2"},{label:"ずれ",value:"半目"}],body:["中間調を灰色で作らず、点の大小と重なりだけで表す。黒の大点と朱の小点を半目ずらすと、離れた位置からは温度のある灰に見える。","重なりが増えるほど色は濁るが、同時に紙の白が効いて明るさが残る。網点は引き算の技法である。"]},{id:"p04",title:"市松の間",caption:"入れ子の正方",support:"大きな市松の内側に半分の市松を潜ませ、境界を曖昧にする。",kind:"check",palette:{bg:"#f2efe4",a:"#16794f",b:"#c9e600"},plates:["#16794f","#c9e600","#17150f","#ff4b26"],h:292,tags:["市松","入れ子"],figure:"bars",meta:[{label:"大",value:"34px"},{label:"小",value:"17px"},{label:"位相",value:"1/4"}],body:["市松は境界がはっきりしすぎる。そこで内側に半分の寸法の市松を四分の一だけずらして重ねた。角の位置が二重になり、視線が正方形の輪郭を確定できなくなる。","曖昧さは面積では作れない。位相のずれだけが、同じ形を別の形に見せる。"]},{id:"p05",title:"同心円の呼吸",caption:"36の輪",support:"円の間隔を一定に保つと、隣の円と干渉して縦の帯が現れる。",kind:"rings",palette:{bg:"#101a1c",a:"#00a89c",b:"#f7f3ea"},plates:["#00a89c","#4fc3ff","#f7f3ea","#ffb100"],h:246,tags:["円","干渉","深"],figure:"rings",meta:[{label:"径",value:"36px"},{label:"線",value:"細"},{label:"副",value:"白"}],body:["同じ径の円を隙間なく並べると、円自身よりも円と円の間にできる菱形の空白が主役になる。模様の主題が、描いていない場所へ移動する瞬間だ。","白の副線を一本挟むと、輪は呼吸するように前後する。線幅の差が時間の差として読まれる。"]},{id:"p06",title:"稲妻の反復",caption:"折返し26",support:"折り返す頂点を上下で色分けし、進行方向を一方に固定する。",kind:"zigzag",palette:{bg:"#fbf7ee",a:"#7b4cf0",b:"#ff3d9a"},plates:["#7b4cf0","#ff3d9a","#2743e8","#17150f"],h:208,tags:["折線","方向"],figure:"stack",meta:[{label:"山",value:"26px"},{label:"谷",value:"26px"},{label:"色",value:"2"}],body:["折線は対称だが、頂点の色を上下で分けると途端に方向を持つ。紫の山と桃の谷を交互に置いただけで、面は右上へ流れ始める。","対称性を壊すのは形ではなく色である。これは斜線でも市松でも同じように働く。"]},{id:"p07",title:"貝殻の列",caption:"半円の重ね",support:"半円を左右から噛み合わせ、鱗にも波にも読める面を作る。",kind:"scallop",palette:{bg:"#fff6e8",a:"#d8663f",b:"#ffb100"},plates:["#d8663f","#ffb100","#ff4b26","#16794f"],h:300,tags:["半円","鱗","暖"],figure:"rings",meta:[{label:"径",value:"28px"},{label:"噛合",value:"左右"},{label:"縦",value:"2倍"}],body:["左右から半円を噛み合わせると、鱗と波の二通りに読める。どちらに見えるかは面の向きではなく、見る側の期待で決まる。","縦の反復を横の二倍に伸ばすと、鱗の読みが強くなる。比率が意味を選んでいる。"]},{id:"p08",title:"立方体の錯視",caption:"三面の明度",support:"三つの菱形に明度差を与えるだけで、平面が箱に反転する。",kind:"cube",palette:{bg:"#f4f1e6",a:"#2743e8",b:"#c9e600"},plates:["#2743e8","#c9e600","#ff4b26","#17150f"],h:336,tags:["錯視","等角"],figure:"stack",meta:[{label:"投影",value:"等角"},{label:"面",value:"3"},{label:"反転",value:"可"}],body:["等角投影の菱形を三枚、明度を変えて並べると、平面は箱の集合に見える。しばらく見つめると凹凸が反転し、箱は窪みに変わる。","この反転は止められない。模様が観察者の解釈に依存している証拠であり、印刷物が動くと言えるほとんど唯一の場面だ。","明度差を詰めると反転は起きにくくなるが、代わりに面としての強度も失われる。"]},{id:"p09",title:"交差線の影",caption:"45度二層",support:"細い線を直交させ、交点だけを濃く沈ませて影を作る。",kind:"hatch",palette:{bg:"#fdfaf3",a:"#17150f",b:"#2743e8"},plates:["#17150f","#2743e8","#4fc3ff","#ff4b26"],h:236,tags:["交差","陰影"],figure:"bars",meta:[{label:"角",value:"±45°"},{label:"幅",value:"1.6px"},{label:"交点",value:"濃"}],body:["斜線を二方向に重ねると交点が濃くなる。線の量は倍でも、暗さは倍を超えて感じられる。交点は面積を持たないのに、影として読まれる。","版画の陰影はこの誤差の上に成り立っている。"]},{id:"p10",title:"縦帯の律動",caption:"不等間隔",support:"帯の幅を三種に限り、繰り返し単位の中で拍を作る。",kind:"bars",palette:{bg:"#141414",a:"#ff4b26",b:"#f7f3ea"},plates:["#ff4b26","#f7f3ea","#ffb100","#7b4cf0"],h:214,tags:["縦","拍","黒"],figure:"bars",meta:[{label:"単位",value:"30px"},{label:"幅",value:"3種"},{label:"拍",value:"3+2"}],body:["等間隔の縞は情報を持たない。幅を三種に限って並べ替えるだけで、面は拍を持ち始める。三と二の組み合わせは、音楽と同じ理由で安定する。","白の帯を一本混ぜると、黒地が休符として働く。"]},{id:"p11",title:"菱形の連鎖",caption:"半目送り",support:"同形の菱形を半目送りで重ね、輪郭を消して連続させる。",kind:"diamond",palette:{bg:"#f6f2e9",a:"#ff3d9a",b:"#7b4cf0"},plates:["#ff3d9a","#7b4cf0","#c9e600","#17150f"],h:276,tags:["菱形","連鎖"],figure:"stack",meta:[{label:"辺",value:"28px"},{label:"送り",value:"半目"},{label:"色",value:"2"}],body:["菱形を半目送りで重ねると、個々の輪郭は失われ、面は連続した織地になる。単位が見えなくなった時点で、模様は素材に変わる。","色を二つに絞るのは節度ではなく必要である。三色を超えると連鎖は模様に戻ってしまう。"]},{id:"p12",title:"モアレの干渉",caption:"二つの中心",support:"わずかに径の違う同心円を二箇所に置き、干渉縞を採取する。",kind:"moire",palette:{bg:"#0d1424",a:"#4fc3ff",b:"#ff3d9a"},plates:["#4fc3ff","#ff3d9a","#c9e600","#f7f3ea"],h:308,tags:["干渉","縞","光"],figure:"rings",meta:[{label:"中心",value:"2"},{label:"差",value:"5%"},{label:"縞",value:"自生"}],body:["描いていない縞が現れる。二つの同心円の径を五パーセントだけずらすと、重なりの位相差が大きな縞として立ち上がる。作者が設計できない模様である。","干渉縞は倍率を変えると位置を変える。つまりこの図版は、印刷寸法が変わると別の絵になる。","採取する以上のことはできない。制御を手放す練習として、これほど適した題材はない。"]},{id:"p13",title:"弧の継ぎ目",caption:"四分円",support:"四分円を対角に置き、継ぎ目を残したまま面を回転させる。",kind:"arc",palette:{bg:"#f0ece0",a:"#16794f",b:"#ffb100"},plates:["#16794f","#ffb100","#d8663f","#2743e8"],h:222,tags:["弧","回転"],figure:"rings",meta:[{label:"単位",value:"32px"},{label:"弧",value:"1/4"},{label:"継目",value:"見せる"}],body:["四分円を対角に配置すると、面は右回りに回転して見える。継ぎ目を隠さないほうが回転は強くなる。破綻が運動の証拠として働くからだ。","二色にすると回転方向が固定される。単色では両方向に読める。"]},{id:"p14",title:"織りの構造",caption:"60度三層",support:"六十度の二方向に横糸を加え、面ではなく構造として見せる。",kind:"weave",palette:{bg:"#fbf6ec",a:"#17150f",b:"#d8663f"},plates:["#17150f","#d8663f","#16794f","#ffb100"],h:262,tags:["織","三層"],figure:"bars",meta:[{label:"角",value:"±60°"},{label:"横糸",value:"1px"},{label:"層",value:"3"}],body:["六十度に交差する二方向の線に、水平の細線を足す。三層目が入った瞬間、模様は面をやめて構造になる。糸として読まれ始めるのだ。","層の順序は入れ替えられない。水平線を最上に置くと、下の二層は背景に落ちる。"]}],Rr=[{id:"b1",name:"幾何",color:"#2743e8",note:"直線と反復"},{id:"b2",name:"印刷",color:"#ff4b26",note:"版と重ね順"},{id:"b3",name:"実験",color:"#16794f",note:"制御を手放す"}],gf=x=>pf.find(H=>H.id===x);function Tu(x,H,j=1){const{bg:o,a:_,b:M}=H,U=p=>`${Math.max(1,+(p*j).toFixed(2))}px`;switch(x){case"grid":{const p=30*j;return{backgroundColor:o,backgroundImage:`linear-gradient(${_} ${U(1.6)}, transparent ${U(1.6)}), linear-gradient(90deg, ${_} ${U(1.6)}, transparent ${U(1.6)}), linear-gradient(${M} ${U(1)}, transpa
